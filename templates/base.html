<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Meal Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Log a meal</a>
    <a href="{{ url_for('meals') }}">My meals</a>
    <a href="{{ url_for('goal') }}">Weekly goal</a>
    <a href="{{ url_for('progress') }}">Progress</a>
    <a href="{{ url_for('history') }}">History</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
